services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env.docker
        required: false
    volumes:
      - app-storage:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ekstensi-network

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ekstensi
      MYSQL_USER: ekstensi_app
      MYSQL_PASSWORD: ekstensi_secret
      MYSQL_ROOT_PASSWORD: ekstensi_root_secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - ekstensi-network

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - app
    networks:
      - ekstensi-network

volumes:
  app-storage:
  mysql-data:

networks:
  ekstensi-network:
    driver: bridge